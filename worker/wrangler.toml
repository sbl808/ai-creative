name = "ai-creative"
main = "src/index.js"
compatibility_date = "2026-01-01"

# --- dev ---
[env.dev]
vars = { ENVIRONMENT = "dev", ALLOWED_ORIGINS = "https://aics-frontend-dev.pages.dev" }
[[env.dev.d1_databases]]
binding = "DB"
database_name = "ai-creative-db-dev"
database_id = "3f747286-9531-4b92-96a7-f0144387bd91"

# --- staging ---
[env.staging]
vars = { ENVIRONMENT = "staging", ALLOWED_ORIGINS = "https://aics-frontend-staging.pages.dev" }
[[env.staging.d1_databases]]
binding = "DB"
database_name = "ai-creative-db-staging"
database_id = "xxxxxxxxx"

# --- prod ---
[env.prod]
vars = { ENVIRONMENT = "prod", ALLOWED_ORIGINS = "https://aics-frontend-prod.pages.dev" }
[[env.prod.d1_databases]]
binding = "DB"
database_name = "ai-creative-db-prod"
database_id = "xxxxxxxx"
