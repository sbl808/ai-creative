name = "aics"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Keep Worker observability disabled; do not capture request or user data.
[observability]
enabled = false

# --- dev ---
[env.dev]
vars = { ENVIRONMENT = "dev", ALLOWED_ORIGINS = "https://aics-frontend-dev.pages.dev" }
[[env.dev.d1_databases]]
binding = "DB"
database_name = "aics-db-dev"
# Local-only placeholder UUID. Wrangler uses local D1 unless --remote is explicitly supplied.
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations-platform"

# --- staging ---
[env.staging]
vars = { ENVIRONMENT = "staging", ALLOWED_ORIGINS = "https://aics-frontend-staging.pages.dev" }
[[env.staging.d1_databases]]
binding = "DB"
database_name = "aics-db-staging"
database_id = "cloudflare အကောင့် မရှိသေးပါ"
migrations_dir = "migrations-platform"

# --- prod ---
[env.prod]
vars = { ENVIRONMENT = "prod", ALLOWED_ORIGINS = "https://aics-frontend-prod.pages.dev" }
[[env.prod.d1_databases]]
binding = "DB"
database_name = "aics-db-prod"
database_id = "cloudflare အကောင့် မရှိသေးပါ"
migrations_dir = "migrations-platform"


# AI Generation rate limiting.
# Namespace IDs are provisional; verify account-wide uniqueness before any remote deployment.
[[env.dev.ratelimits]]
name = "AI_GENERATION_RATE_LIMITER"
namespace_id = "2101"
[env.dev.ratelimits.simple]
limit = 3
period = 60

[[env.dev.ratelimits]]
name = "AI_CONNECTION_TEST_RATE_LIMITER"
namespace_id = "2111"
[env.dev.ratelimits.simple]
limit = 5
period = 60

[[env.staging.ratelimits]]
name = "AI_GENERATION_RATE_LIMITER"
namespace_id = "2102"
[env.staging.ratelimits.simple]
limit = 3
period = 60

[[env.staging.ratelimits]]
name = "AI_CONNECTION_TEST_RATE_LIMITER"
namespace_id = "2112"
[env.staging.ratelimits.simple]
limit = 5
period = 60

[[env.prod.ratelimits]]
name = "AI_GENERATION_RATE_LIMITER"
namespace_id = "2103"
[env.prod.ratelimits.simple]
limit = 3
period = 60

[[env.prod.ratelimits]]
name = "AI_CONNECTION_TEST_RATE_LIMITER"
namespace_id = "2113"
[env.prod.ratelimits.simple]
limit = 5
period = 60
