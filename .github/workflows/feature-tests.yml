name: Feature Branch Tests

on:
  push:
    branches:
      - feature/secure-api-key-settings
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Worker route regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run route regression tests
        run: node --experimental-default-type=module scripts/regression-test.mjs

  security:
    name: Security contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run security tests
        run: node --experimental-default-type=module scripts/security-tests.mjs

  browser-static:
    name: Browser script static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser scripts
        run: node --experimental-default-type=module scripts/check-browser-scripts.mjs
