name: CI

# Run checks on every branch push and on pull requests targeting main.
# This workflow tests code only; it does not deploy.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Worker route regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run route regression tests
        run: node --experimental-default-type=module scripts/regression-test.mjs
      - name: Run prompt merge engine contract tests
        run: node --experimental-default-type=module scripts/prompt-merge-engine-test.mjs
      - name: Run prompt orchestrator contract tests
        run: node --experimental-default-type=module scripts/prompt-orchestrator-test.mjs
      - name: Run Task Instructions Admin API contract tests
        run: node --experimental-default-type=module scripts/task-instructions-api-test.mjs
      - name: Run Idea Workspace contract tests
        run: node --experimental-default-type=module scripts/ideas-contract-test.mjs
      - name: Run AI provider contract tests
        run: node --experimental-default-type=module scripts/ai-provider-contract-test.mjs
      - name: Run AI error contract tests
        run: node --experimental-default-type=module scripts/ai-error-contract-test.mjs
      - name: Run Story Studio API contract tests
        run: node --experimental-default-type=module scripts/story-contract-test.mjs
      - name: Run Story Prompt Orchestrator integration tests
        run: node --experimental-default-type=module scripts/story-prompt-orchestrator-test.mjs
      - name: Run Story Video Prompt Orchestrator integration tests
        run: node --experimental-default-type=module scripts/story-video-prompt-orchestrator-test.mjs
      - name: Run IndexedDB owner isolation tests
        run: node --experimental-default-type=module scripts/indexeddb-owner-isolation-test.mjs
      - name: Run IndexedDB Storage Core tests
        run: node --experimental-default-type=module scripts/indexeddb-storage-core-test.mjs
      - name: Run IndexedDB Projects Repository tests
        run: node --experimental-default-type=module scripts/indexeddb-projects-test.mjs
      - name: Run IndexedDB Sessions Repository tests
        run: node --experimental-default-type=module scripts/indexeddb-sessions-test.mjs
      - name: Run IndexedDB Session Results Repository tests
        run: node --experimental-default-type=module scripts/indexeddb-session-results-test.mjs
      - name: Run IndexedDB Story Session persistence tests
        run: node --experimental-default-type=module scripts/indexeddb-story-session-test.mjs

  security:
    name: Security contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run security tests
        run: node --experimental-default-type=module scripts/security-tests.mjs

  browser-static:
    name: Browser script static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser scripts
        run: node --experimental-default-type=module scripts/check-browser-scripts.mjs

  shim-writer-safety:
    name: Shim writer safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test guarded shim writer
        run: node --experimental-default-type=module --test scripts/write-shims.test.mjs

  migration-contract:
    name: D1 migration schema contract (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all migrations with SQLite (offline)
        run: python scripts/test-all-migrations.py
      - name: Validate rate-limit migration behavior (offline)
        run: python scripts/test-api-test-limits-migration.py

  studio-architecture:
    name: Studio architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Studio page exports, lazy-loader registry, imports, and isolation boundaries
        run: node --experimental-default-type=module scripts/verify-split.mjs
      - name: Run Studio Handoff contract tests
        run: node --experimental-default-type=module scripts/studio-handoff-contract-test.mjs
      - name: Run IndexedDB Studio Handoff tests
        run: node --experimental-default-type=module scripts/indexeddb-studio-handoff-test.mjs
      - name: Run Story Video Plan session bridge tests
        run: node --experimental-default-type=module scripts/story-video-session-bridge-test.mjs
      - name: Run Story / Video Plan UI separation tests
        run: node --experimental-default-type=module scripts/story-video-plan-page-test.mjs
      - name: Run Story Video Plan state and migration tests
        run: node --experimental-default-type=module scripts/story-video-plan-state-test.mjs
